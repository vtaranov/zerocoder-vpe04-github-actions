name: Build, test and publish Docker image

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# Serialize publication so latest always reflects the newest successful main run.
concurrency:
  group: vpe04-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build, test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Define image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:sha-$GITHUB_SHA" \
            --tag "$IMAGE:latest" .

      - name: Run API unit tests inside the image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: docker run --rm "$IMAGE:sha-$GITHUB_SHA" python -m unittest discover -s tests -v

      - name: Start container and check HTTP API
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          trap 'docker logs vpe04-smoke; docker rm -f vpe04-smoke' EXIT
          docker run --detach --name vpe04-smoke \
            --publish 127.0.0.1:8000:8000 \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --cap-drop ALL --security-opt no-new-privileges \
            "$IMAGE:sha-$GITHUB_SHA"
          python3 scripts/smoke_test.py

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"
          docker pull "$IMAGE:sha-$GITHUB_SHA"
          {
            echo '### Published Docker image'
            echo "- Commit: $GITHUB_SHA"
            echo "- Image: $IMAGE:sha-$GITHUB_SHA"
            echo "- Latest: $IMAGE:latest"
            echo '- Unit tests and HTTP smoke test passed before publication.'
            docker image inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{range .RepoDigests}}- Digest: {{.}}{{println}}{{end}}'
          } >> "$GITHUB_STEP_SUMMARY"
